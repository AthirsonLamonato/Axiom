name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system audio deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml psutil requests duckduckgo-search schedule keyboard plyer
          pip install scikit-learn pydantic
          pip install faster-whisper pyaudio
          pip install google-auth google-auth-oauthlib google-api-python-client
          pip install fastapi "uvicorn[standard]" python-multipart httpx2
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
