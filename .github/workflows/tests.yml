name: Tests

on:
  push:
    branches: [master, homologacao, main, dev]
  pull_request:
    branches: [master, homologacao, main, dev]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

permissions:
  contents: read

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install system audio deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-voice.txt
          pip install -r requirements-dev.txt

      - name: Lint source
        run: python -m ruff check core input modules output plugins storage web main.py mcp_server.py setup_wizard.py

      - name: Run tests
        # O console Windows pode emitir CP1252; sem captura, o pytest não converte
        # bytes inválidos em erros de teardown que mascaram o teste real.
        run: python -m pytest -v --tb=short --capture=no --cov=core --cov=modules --cov=web --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
