name: Tests

on:
  push:
    branches: [master, homologacao, main, dev]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system audio deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-voice.txt
          pip install -r requirements-dev.txt

      - name: Lint source
        run: python -m ruff check core input modules output plugins storage web main.py mcp_server.py setup_wizard.py

      - name: Run tests
        run: python -m pytest -v --tb=short
