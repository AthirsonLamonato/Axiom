# ──────────────────────────────────────────────
# Axiom — Configuração principal
# Copie este arquivo para core/config.yaml e ajuste conforme necessário
# ──────────────────────────────────────────────

# ── Perfil ativo ──────────────────────────────
profile:
  active: work          # work | casual

# ── Wake word ─────────────────────────────────
wake_word:
  keyword: porcupine    # keywords built-in: porcupine, jarvis, computer, etc.
  sensitivity: 0.5      # 0.0 (menos sensível) → 1.0 (mais sensível)
  enabled: true
  access_key: ""        # PICOVOICE_ACCESS_KEY — deixe vazio para usar push-to-talk

# ── Speech-to-Text ────────────────────────────
stt:
  model: base           # tiny | base | small | medium | large
  language: pt          # código do idioma
  device: cpu           # cpu | cuda (GPU Nvidia)
  auto_calibrate: true  # calibrar ruído ambiente na inicialização do modo voz
  noise_threshold: 300  # limiar de energia RMS (atualizado automaticamente na calibração)

# ── IA local (Ollama) ─────────────────────────
ai:
  provider: ollama      # ollama | anthropic
  model: llama3         # llama3 | mistral | phi3
  ollama_url: http://localhost:11434
  max_tokens: 1024
  use_context: true     # injeta histórico da sessão no prompt (memória contextual)
  system_prompt: |
    Você é Axiom, um assistente pessoal técnico e objetivo.
    Responda sempre em português, de forma direta e sem rodeios.
    Para tarefas de sistema, confirme antes de executar ações críticas.

# ── Text-to-Speech ────────────────────────────
tts:
  enabled: true
  engine: pyttsx3       # pyttsx3 | coqui
  rate: 175             # palavras por minuto
  volume: 0.9

# ── Overlay visual ────────────────────────────
overlay:
  enabled: true
  position: top-left    # top-left | top-right | bottom-left | bottom-right
  duration_ms: 4000     # tempo de exibição de cada mensagem
  opacity: 0.92

# ── Segurança ─────────────────────────────────
security:
  confirm_critical: true     # pede confirmação para ações críticas
  critical_commands:
    - fechar tudo
    - deletar
    - formatar
    - git push
    - git reset
    - rm -rf

# ── Transcrição ───────────────────────────────
transcription:
  output_dir: data/transcriptions
  format: markdown           # markdown | txt
  auto_save: true

# ── Plugins ───────────────────────────────────
plugins:
  enabled: true
  directory: plugins        # diretório escaneado na inicialização

# ── Google Calendar ───────────────────────────
calendar:
  credentials_path: core/credentials.json  # OAuth 2.0 client secrets (baixe do Google Cloud)
  token_path: core/calendar_token.json     # gerado automaticamente após primeira auth
  timezone: America/Sao_Paulo

# ── Obsidian ──────────────────────────────────
obsidian:
  vault_path: ""            # ex: C:/Users/user/Documents/Obsidian/Axiom
                            # Deixe vazio para desabilitar exportação

# ── Backup ────────────────────────────────────
backup:
  local_dir: data/backups
  google_drive:
    enabled: false           # true após configurar credenciais OAuth
    folder_name: Axiom Backups
    credentials_path: core/credentials.json

# ── Logs ──────────────────────────────────────
logging:
  level: INFO                # DEBUG | INFO | WARNING | ERROR
  file: logs/axiom.log
  max_mb: 10

# ── Perfis de comportamento ───────────────────
profiles:
  work:
    tts_rate: 175
    tts_volume: 0.9
    response_style: technical   # respostas diretas e técnicas
    startup_routine: work_mode

  casual:
    tts_rate: 160
    tts_volume: 0.85
    response_style: friendly
    startup_routine: null

  focus:
    tts_rate: 150
    tts_volume: 0.75
    response_style: concise     # máximo 2 frases por resposta
    startup_routine: null

  meeting:
    tts_rate: 145
    tts_volume: 0.7
    response_style: formal
    startup_routine: null

  night:
    tts_rate: 155
    tts_volume: 0.5
    response_style: friendly
    startup_routine: null

# ── Rotinas ───────────────────────────────────
routines:
  work_mode:
    name: "Modo trabalho"
    steps:
      - action: open_app
        target: code            # VS Code
      - action: open_app
        target: chrome
      - action: notify
        message: "Modo trabalho ativado. Bom trabalho!"

  end_of_day:
    name: "Fim do dia"
    steps:
      - action: save_transcriptions
      - action: notify
        message: "Transcrições salvas. Até amanhã!"
      - action: close_overlay
