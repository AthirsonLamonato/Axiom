# ──────────────────────────────────────────────
# Paçoca — Configuração principal
# Copie este arquivo para core/config.yaml e ajuste conforme necessário
# ──────────────────────────────────────────────

# ── Perfil ativo ──────────────────────────────
profile:
  active: work          # work | casual

# ── Wake word ─────────────────────────────────
wake_word:
  enabled: true
  sensitivity: 0.5      # 0.0 (menos sensível) → 1.0 (mais sensível)
  keyword: "paçoca"     # nome exibido no terminal (cosmético)
  model_path: ""        # Caminho para modelo .onnx customizado (ex: pacoca.onnx)
                        # Deixe vazio para usar hey_jarvis como modelo de detecção
                        # Para treinar o modelo "Paçoca": github.com/dscripka/openWakeWord#training

# ── Speech-to-Text ────────────────────────────
stt:
  model: small          # tiny | base | small | medium | large
  language: pt          # código do idioma
  device: cpu           # cpu | cuda (GPU Nvidia)
  auto_calibrate: true  # calibrar ruído ambiente na inicialização do modo voz
  noise_threshold: 300  # limiar de energia RMS (atualizado automaticamente na calibração)

# ── IA local (Ollama) ─────────────────────────
ai:
  provider: groq        # ollama | groq
  model: llama3         # llama3 | mistral | phi3 (modelos Ollama)
  ollama_url: http://localhost:11434
  groq_model: llama-3.1-8b-instant  # sobrescrito por GROQ_MODEL no .env
  groq_api_key: ""                   # sobrescrito por GROQ_API_KEY no .env
  max_tokens: 1024
  use_context: true     # injeta histórico da sessão no prompt (memória contextual)
  auto_learn: false     # extrai fatos de cada conversa e salva na KB (opt-in)
                        # quando true, cada troca é enviada ao LLM configurado
  embeddings_provider: auto             # auto | gemini | ollama | none — memória semântica da KB
  embeddings_model: gemini-embedding-001  # modelo Gemini (free tier)
  embeddings_ollama_model: nomic-embed-text  # requer `ollama pull nomic-embed-text`
  embeddings_api_key: ""                # sobrescrito por GEMINI_API_KEY no .env
  system_prompt: |
    Você é Paçoca, um assistente pessoal técnico e objetivo.
    Responda sempre em português, de forma direta e sem rodeios.
    Para tarefas de sistema, confirme antes de executar ações críticas.

# ── Text-to-Speech ────────────────────────────
tts:
  enabled: true
  engine: edge          # edge | pyttsx3 | coqui
  edge_voice: pt-BR-FranciscaNeural  # pt-BR-FranciscaNeural | pt-BR-AntonioNeural
  rate: 175             # palavras por minuto (só pyttsx3)
  volume: 0.9

# ── Overlay visual ────────────────────────────
overlay:
  enabled: true
  position: top-left    # top-left | top-right | bottom-left | bottom-right
  duration_ms: 4000     # tempo de exibição de cada mensagem
  opacity: 0.92

# ── Segurança ─────────────────────────────────
security:
  confirm_critical: true     # pede confirmação para ações críticas
  session_timeout_min: 30    # dashboard web: logout automático após N min de inatividade
  login_max_attempts: 5      # dashboard web: máx. tentativas de senha por IP na janela abaixo
  login_window_s: 60         # dashboard web: janela (segundos) do rate limit de login
  critical_commands:
    - fechar tudo
    - deletar
    - formatar
    - git push
    - git reset
    - rm -rf

# ── Transcrição ───────────────────────────────
transcription:
  output_dir: data/transcriptions
  format: markdown           # markdown | txt
  auto_save: true

# ── Plugins ───────────────────────────────────
plugins:
  enabled: true
  directory: plugins        # diretório escaneado na inicialização

# ── Google Calendar ───────────────────────────
calendar:
  credentials_path: core/credentials.json  # OAuth 2.0 client secrets (baixe do Google Cloud)
  token_path: core/google_token.json        # gerado automaticamente após primeira auth
  timezone: America/Sao_Paulo

# ── Dashboard web ─────────────────────────────
web:
  password: ""              # Deixe vazio para sem autenticação

# ── Obsidian ──────────────────────────────────
obsidian:
  vault_path: ""            # ex: C:/Users/user/Documents/Obsidian/Pacoca
                            # Deixe vazio para desabilitar exportação

# ── Backup ────────────────────────────────────
backup:
  local_dir: data/backups
  auto_schedule: true        # agenda backup automático diário
  daily_time: "23:30"        # horário do backup automático (HH:MM)
  google_drive:
    enabled: false           # true após configurar credenciais OAuth
    folder_name: Paçoca Backups
    credentials_path: core/credentials.json
    token_path: core/google_token.json

# ── Privacidade e retenção de dados ──────────
privacy:
  retention_days: 30          # dias de histórico a manter (0 = sem limpeza automática)
  # Quando ai.provider=groq, comandos são enviados para a API do Groq (online).
  # Para processamento 100% local, use ai.provider=ollama.

# ── Logs ──────────────────────────────────────
logging:
  level: INFO                # DEBUG | INFO | WARNING | ERROR
  file: logs/pacoca.log
  max_mb: 10

# ── Perfis de comportamento ───────────────────
profiles:
  work:
    tts_rate: 175
    tts_volume: 0.9
    response_style: technical   # respostas diretas e técnicas
    startup_routine: work_mode

  casual:
    tts_rate: 160
    tts_volume: 0.85
    response_style: friendly
    startup_routine: null

  focus:
    tts_rate: 150
    tts_volume: 0.75
    response_style: concise     # máximo 2 frases por resposta
    startup_routine: null

  meeting:
    tts_rate: 145
    tts_volume: 0.7
    response_style: formal
    startup_routine: null

  night:
    tts_rate: 155
    tts_volume: 0.5
    response_style: friendly
    startup_routine: null

# ── Rotinas ───────────────────────────────────
routines:
  work_mode:
    name: "Modo trabalho"
    steps:
      - action: open_app
        target: code            # VS Code
      - action: open_app
        target: chrome
      - action: notify
        message: "Modo trabalho ativado. Bom trabalho!"

  end_of_day:
    name: "Fim do dia"
    steps:
      - action: save_transcriptions
      - action: notify
        message: "Transcrições salvas. Até amanhã!"
      - action: close_overlay
