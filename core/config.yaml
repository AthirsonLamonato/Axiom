# ──────────────────────────────────────────────
# Paçoca — Configuração principal
# Copie este arquivo para core/config.yaml e ajuste conforme necessário
# ──────────────────────────────────────────────

# ── Perfil ativo ──────────────────────────────
profile:
  active: work          # work | casual

# ── Wake word ─────────────────────────────────
wake_word:
  enabled: true
  startup_greeting: false # inicia silencioso; apenas espera a frase de ativação
  sensitivity: 0.5      # 0.0 (menos sensível) → 1.0 (mais sensível)
  keyword: "hey jarvis" # frase real do modelo padrão quando model_path está vazio
  model_path: ""        # Caminho para modelo .onnx customizado (ex: pacoca.onnx)
                        # Deixe vazio para usar hey_jarvis como modelo de detecção
                        # Para treinar o modelo "Paçoca": github.com/dscripka/openWakeWord#training

# ── Conversa contínua ─────────────────────────
voice:
  hands_free: true             # mantém a conversa após a primeira ativação
  followup_timeout_s: 8        # silêncio para encerrar a sessão hands-free
  max_turns: 20                # limite de segurança por sessão
  session_end_message: "Encerrando a conversa."
  exit_commands:
    - encerrar conversa
    - finalizar conversa
    - voltar a esperar

# ── Speech-to-Text ────────────────────────────
stt:
  model: base           # base reduz a latência no CPU; small prioriza precisão
  language: pt          # código do idioma
  device: cpu           # cpu | cuda (GPU Nvidia)
  local_files_only: true # usa o modelo já baixado e evita consulta ao Hugging Face no boot
  auto_calibrate: false # evita abrir o microfone no boot; diga "calibrar microfone" quando necessário
  noise_threshold: 300  # limiar de energia RMS (atualizado automaticamente na calibração)
  beep_enabled: true    # sinal curto: comece a falar depois dele
  beam_size: 2          # equilíbrio entre precisão e velocidade no CPU
  initial_prompt: "Comandos para Paçoca: Spotify, Chrome, navegador, volume, pausar, continuar, próxima música, abrir aplicativo, pesquisar na internet."

# ── IA local (Ollama) ─────────────────────────
ai:
  provider: ollama      # ollama (local, padrão) | groq (requer chave)
  model: llama3         # llama3 | mistral | phi3 (modelos Ollama)
  ollama_url: http://localhost:11434
  groq_model: llama-3.1-8b-instant  # sobrescrito por GROQ_MODEL no .env
  groq_api_key: ""                   # sobrescrito por GROQ_API_KEY no .env
  max_tokens: 1024
  use_context: true     # injeta histórico da sessão no prompt (memória contextual)
  auto_learn: false     # extrai fatos de cada conversa e salva na KB (opt-in)
                        # quando true, cada troca é enviada ao LLM configurado
  embeddings_provider: ollama           # ollama | gemini | auto | none — padrão sem custo e local
  embeddings_model: gemini-embedding-001  # cloud opcional; quotas podem mudar
  embeddings_ollama_model: nomic-embed-text  # requer `ollama pull nomic-embed-text`
  embeddings_api_key: ""                # sobrescrito por GEMINI_API_KEY no .env
  system_prompt: |
    Você é Paçoca, um assistente pessoal técnico e objetivo.
    Responda sempre em português, de forma direta e sem rodeios.
    Para tarefas de sistema, confirme antes de executar ações críticas.

# ── Text-to-Speech ────────────────────────────
tts:
  enabled: true
  engine: edge          # voz neural gratuita; pyttsx3 é offline, mas mais robótico
  edge_voice: pt-BR-FranciscaNeural  # pt-BR-FranciscaNeural | pt-BR-AntonioNeural
  edge_rate: "+4%"      # natural, sem alongar demais as respostas
  edge_pitch: "+0Hz"    # edge-tts: ajuste de tom
  edge_volume: "+0%"    # edge-tts: volume relativo
  edge_timeout: 15      # segundos antes de cair para fallback
  rate: 160             # palavras por minuto (só pyttsx3)
  volume: 0.9

# ── Overlay visual ────────────────────────────
overlay:
  enabled: true
  position: center      # center | top-left | top-right | bottom-left | bottom-right
  theme: blue            # blue | green | purple | orange — cor de destaque (botão enviar, bordas)
  duration_ms: 4000     # não usado (histórico de chat substitui as mensagens em toast); mantido p/ compat
  opacity: 1.0

# ── Segurança ─────────────────────────────────
security:
  confirm_critical: true     # pede confirmação para ações críticas
  session_timeout_min: 30    # dashboard web: logout automático após N min de inatividade
  login_max_attempts: 5      # dashboard web: máx. tentativas de senha por IP na janela abaixo
  login_window_s: 60         # dashboard web: janela (segundos) do rate limit de login
  critical_commands:
    - fechar tudo
    - deletar
    - formatar
    - git push
    - git reset
    - rm -rf

# ── Transcrição ───────────────────────────────
transcription:
  output_dir: data/transcriptions
  format: markdown           # markdown | txt
  auto_save: true

# ── Plugins ───────────────────────────────────
plugins:
  enabled: true
  directory: plugins        # diretório escaneado na inicialização

# ── Google Calendar ───────────────────────────
calendar:
  credentials_path: core/credentials.json  # OAuth 2.0 client secrets (baixe do Google Cloud)
  token_path: core/google_token.json        # gerado automaticamente após primeira auth
  timezone: America/Sao_Paulo

# ── Ações externas reais ──────────────────────
# Fail-closed: em "simulate", WhatsApp e ações de Calendar com convidados
# apenas geram uma prévia. Para produção ainda são necessárias confirmação
# por ação, whitelist e a variável PACOCA_ALLOW_REAL_EXTERNAL_ACTIONS com a
# frase documentada. Nunca habilite durante desenvolvimento/testes.
external_actions:
  mode: simulate             # simulate | live
  live_enabled: false        # segunda trava; false por padrão

# ── Dashboard web ─────────────────────────────
web:
  password: ""              # Deixe vazio para sem autenticação

# ── Obsidian ──────────────────────────────────
obsidian:
  vault_path: ""            # ex: C:/Users/user/Documents/Obsidian/Pacoca
                            # Deixe vazio para desabilitar exportação

# ── Backup ────────────────────────────────────
backup:
  local_dir: data/backups
  auto_schedule: true        # agenda backup automático diário
  daily_time: "23:30"        # horário do backup automático (HH:MM)
  google_drive:
    enabled: false           # true após configurar credenciais OAuth
    folder_name: Paçoca Backups
    credentials_path: core/credentials.json
    token_path: core/google_token.json

# ── Privacidade e retenção de dados ──────────
privacy:
  retention_days: 30          # dias de histórico a manter (0 = sem limpeza automática)
  redact_sensitive: true      # mascara telefone/email/segredos antes de persistir/exibir
  allow_screenshots: false    # opt-in local: screenshots podem conter dados privados
  # Quando ai.provider=groq, comandos são enviados para a API do Groq (online).
  # Para processamento 100% local, use ai.provider=ollama.

# ── Logs ──────────────────────────────────────
logging:
  level: INFO                # DEBUG | INFO | WARNING | ERROR
  file: logs/pacoca.log
  max_mb: 10

# ── Perfis de comportamento ───────────────────
profiles:
  work:
    tts_rate: 175
    tts_volume: 0.9
    response_style: technical   # respostas diretas e técnicas
    startup_routine: work_mode

  casual:
    tts_rate: 160
    tts_volume: 0.85
    response_style: friendly
    startup_routine: null

  focus:
    tts_rate: 150
    tts_volume: 0.75
    response_style: concise     # máximo 2 frases por resposta
    startup_routine: null

  meeting:
    tts_rate: 145
    tts_volume: 0.7
    response_style: formal
    startup_routine: null

  night:
    tts_rate: 155
    tts_volume: 0.5
    response_style: friendly
    startup_routine: null

# ── Rotinas ───────────────────────────────────
routines:
  work_mode:
    name: "Modo trabalho"
    steps:
      - action: open_app
        target: code            # VS Code
      - action: open_app
        target: chrome
      - action: notify
        message: "Modo trabalho ativado. Bom trabalho!"

  end_of_day:
    name: "Fim do dia"
    steps:
      - action: save_transcriptions
      - action: notify
        message: "Transcrições salvas. Até amanhã!"
      - action: close_overlay
    # Exemplo de agendamento automático (descomente para ativar):
    # schedule:
    #   time: "18:00"     # HH:MM, disparo automático sem comando do usuário
    #   days: weekday     # weekday | weekend | morning | afternoon | evening | daily

# ── Briefing diário proativo ───────────────────
briefing:
  enabled: true
  time: "08:00"             # horário do briefing automático (HH:MM)

# ── Produtividade ───────────────────────────────
productivity:
  break_after_min: 90        # sugere pausa após N min contínuos sem pausa (0 = desativa)

# ── Detector de reunião ─────────────────────────
meeting_detector:
  auto_summarize: true      # gera sumário automático da reunião ao detectar o fim

# ── Aprendizado proativo ────────────────────────
learner:
  proactive_enabled: true
  interval_hours: 24         # gera insight de uso a cada N horas sozinho

# ── WhatsApp ─────────────────────────────────────
# ⚠ Por segurança, mensagens só são enviadas para números na whitelist
# abaixo, mesmo após confirmação do usuário. Adicione outros números com
# cautela — esta é a última barreira antes de um envio real.
whatsapp:
  enabled: true
  allowed_numbers: []         # nunca versione telefone pessoal; configure localmente
  contacts: {}                # nome -> número; valores reais só no config.local.yaml

# ── Roteamento semântico que aprende ────────────
# Cache que reaproveita resoluções do LLM para paráfrases futuras, sem rede
# além de um embedding. Requer ai.embeddings_provider != none.
semantic_router:
  enabled: true
  threshold: 0.90            # similaridade mínima (0–1) para reaproveitar um acerto
  max_entries: 500           # tamanho máximo do cache (poda os menos usados)

# ── Detector de hábitos → sugestão de rotinas ───
habits:
  enabled: true
  min_days: 3                # ações repetidas em N dias distintos viram hábito
  interval_hours: 24         # verifica hábitos novos a cada N horas sozinho

# ── Resolução de anáfora/seguimento ─────────────
# Entende "de novo", "fecha ele", "e amanhã?" usando o turno anterior.
anaphora:
  enabled: true

# ── Confiança aprendida (confirmações) ──────────
# Após N aprovações seguidas, deixa de pedir confirmação para a MESMA ação de
# risco MÉDIO. Risco alto (WhatsApp, apagar evento) sempre confirma.
trust:
  enabled: true
  threshold: 3               # aprovações consecutivas para passar a confiar
